version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: domipyme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: domipyme
      POSTGRES_USER: domipyme
      POSTGRES_PASSWORD: domipyme_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - domipyme_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domipyme"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: domipyme_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - domipyme_network
    environment:
      SECRET_KEY: "REEMPLAZAME_EN_PROD"
      DEBUG: "0"
      DATABASE_ENGINE: "postgres"
      POSTGRES_DB: domipyme
      POSTGRES_USER: domipyme
      POSTGRES_PASSWORD: domipyme_secure_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: "localhost 127.0.0.1"
      FRONTEND_BASE_URL: "http://localhost:5173"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      EMAIL_BACKEND: "smtp"
      EMAIL_HOST: "smtp.sendgrid.net"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "1"
      EMAIL_HOST_USER: "apikey"
      EMAIL_HOST_PASSWORD: "YOUR_SENDGRID_API_KEY"
      DEFAULT_FROM_EMAIL: "no-reply@domipyme.com"

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  domipyme_network:
    driver: bridge
