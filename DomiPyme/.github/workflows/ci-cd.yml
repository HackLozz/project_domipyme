name: Django CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: domipyme
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: domipyme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop build if syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,venv,__pycache__
        # Check for other issues (non-blocking)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=migrations,venv,__pycache__
    
    - name: Check code formatting with black
      run: |
        black --check --exclude migrations .
      continue-on-error: true
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-ci-cd-pipeline-do-not-use-in-production
        DEBUG=True
        ALLOWED_HOSTS=localhost,127.0.0.1
        FRONTEND_BASE_URL=http://localhost:5173
        CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
        
        DATABASE_ENGINE=django.db.backends.postgresql
        DATABASE_NAME=domipyme_test
        DATABASE_USER=domipyme
        DATABASE_PASSWORD=testpassword
        DATABASE_HOST=localhost
        DATABASE_PORT=5432
        
        EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
        EMAIL_HOST=smtp.gmail.com
        EMAIL_PORT=587
        EMAIL_USE_TLS=True
        EMAIL_HOST_USER=test@example.com
        EMAIL_HOST_PASSWORD=testpassword
        DEFAULT_FROM_EMAIL=DomiPyme <noreply@domipyme.com>
        EOF
    
    - name: Run migrations
      run: |
        python manage.py migrate --noinput
    
    - name: Run tests with pytest
      run: |
        pytest --verbose --tb=short --maxfail=3
    
    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run --noinput

  test-frontend:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint with ESLint
      run: npm run lint
      continue-on-error: true
    
    - name: Build frontend
      run: npm run build
    
    - name: Check build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi

  security-check:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install safety
      run: pip install safety
    
    - name: Check Python dependencies for vulnerabilities
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        safety check --json || true
      continue-on-error: true
    
    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Audit npm dependencies
      working-directory: ./frontend
      run: npm audit --audit-level=moderate || true
      continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      working-directory: ./backend
      run: |
        docker build -t domipyme-backend:latest .
    
    - name: Test Docker image
      working-directory: ./backend
      run: |
        docker run --rm domipyme-backend:latest python manage.py check

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "🚀 Ready for deployment to production"
        echo "Add deployment steps here (e.g., SSH to server, docker-compose pull/up, etc.)"
    
    # Example deployment steps (uncomment and configure as needed):
    # - name: Deploy to server
    #   uses: appleboy/ssh-action@v1.0.0
    #   with:
    #     host: ${{ secrets.DEPLOY_HOST }}
    #     username: ${{ secrets.DEPLOY_USER }}
    #     key: ${{ secrets.DEPLOY_KEY }}
    #     script: |
    #       cd /opt/domipyme
    #       git pull origin main
    #       docker-compose down
    #       docker-compose up -d --build
    #       docker-compose exec -T web python manage.py migrate --noinput
